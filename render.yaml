services:
  # Next.js Frontend
  - type: web
    name: knot-frontend
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    rootDir: frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: knot-backend-core
          property: host

  # NestJS Core Backend Gateway
  - type: web
    name: knot-backend-core
    runtime: node
    buildCommand: npm install --include=dev && npm run build && npx prisma generate
    startCommand: npm run start:prod
    rootDir: backend-core
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: knot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: knot-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: knot-backend-ai
          property: host
      - key: JWT_SECRET
        generateValue: true

  # FastAPI AI Microservice
  - type: web
    name: knot-backend-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend-ai
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false

  # Managed Redis (Key Value Service)
  - type: keyvalue
    name: knot-redis
    plan: free
    ipAllowList: []

# Managed Postgres Database
databases:
  - name: knot-db
    plan: free
    postgresMajorVersion: "15"
