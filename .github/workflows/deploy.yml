name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deployment Archive
        run: |
          # Exclude .git, node_modules, and the archive itself to prevent read errors
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./backend-core/node_modules' --exclude='./backend-ai/node_modules' --exclude='./frontend/node_modules' --exclude='./mobile/node_modules' --exclude='./knot-deploy.tar.gz' -czf knot-deploy.tar.gz .

      - name: Copy Archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "knot-deploy.tar.gz"
          target: "~/"

      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting Deployment..."
            
            # Unpack the new code
            mkdir -p ~/knot
            tar -xzf ~/knot-deploy.tar.gz -C ~/knot
            cd ~/knot
            
            # Create production .env file
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF
            
            # Restart Docker containers
            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d --build
            
            echo "Deployment Successful!"
